server:
  port: ${PORT:8080}

spring:
  application:
    name: seat-reservation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seat_reservation}
    username: ${DB_USERNAME:seat_app}
    password: ${DB_PASSWORD:seat_app_local_only}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
