server:
  port: ${PORT:8080}

spring:
  application:
    name: seat-reservation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seat_reservation}
    username: ${DB_USERNAME:seat_app}
    password: ${DB_PASSWORD:seat_app_local_only}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

app:
  security:
    jwt-issuer: ${JWT_ISSUER:seat-reservation}
    jwt-secret: ${JWT_SECRET}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%t] [req_id=%X{requestId:-none}] %logger{36} : %m%n"
