app:
  security:
    jwt-issuer: ${JWT_ISSUER:seat-reservation}
    jwt-secret: ${JWT_SECRET:test-jwt-secret-must-be-at-least-32-bytes-long-for-hs256!}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true