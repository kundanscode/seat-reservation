services:
  db:
    image: postgres:17-alpine
    container_name: seat-reservation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-seat_reservation}
      POSTGRES_USER: ${DB_USERNAME:-seat_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seat_app_local_only}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-seat_reservation}
      DB_USERNAME: ${DB_USERNAME:-seat_app}
      DB_PASSWORD: ${DB_PASSWORD:-seat_app_local_only}
      JWT_ISSUER: ${JWT_ISSUER:-seat-reservation}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-change-me-123456789}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8080/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
