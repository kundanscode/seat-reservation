services:
  db:
    image: postgres:17-alpine
    container_name: seat-reservation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: seat_reservation
      POSTGRES_USER: seat_app
      POSTGRES_PASSWORD: seat_app_local_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat_app -d seat_reservation"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
